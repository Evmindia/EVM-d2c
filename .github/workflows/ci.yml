name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + security tests
        run: npm test

      - name: Dependency audit (high+)
        run: npm run audit || true
        continue-on-error: true

      - name: Production build
        run: npm run build
        env:
          # Public placeholder only — no real secrets in CI for the build step.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
